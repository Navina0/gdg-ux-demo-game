<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b5e20">
<title>Leaderboard · Mango Catch</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans Tamil","Segoe UI",Roboto,sans-serif;background:linear-gradient(#7ec8e3,#c8f0a0 70%,#5aa83a) fixed;color:#1b3d1b}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:20px;padding:18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{margin:0 0 6px;font-size:28px;text-align:center}
.explain{margin:0 0 12px;text-align:center;font-size:14px;color:#456}
.explain b{color:#e65100}
table{width:100%;border-collapse:collapse;font-size:16px}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;color:#456;padding:8px 4px;border-bottom:2px solid #c8e6c9;text-align:center}
td{padding:10px 4px;border-bottom:1px solid #eef3ee;text-align:center}
td.rank{font-weight:800;font-size:18px}
td.adj{font-weight:800;color:#1b5e20;font-size:18px}
td.hints.many{color:#c62828;font-weight:700}
tr.top td{background:#fff8e1}
.badge{display:inline-block;margin-left:4px;font-size:12px;background:#fff3c4;border:1px solid #f4b400;border-radius:999px;padding:1px 7px;white-space:nowrap}
.state{text-align:center;padding:22px 8px;color:#456;font-size:15px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #c8e6c9;border-top-color:#1b5e20;border-radius:50%;animation:s 1s linear infinite;vertical-align:-4px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:#567;margin-top:10px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.who .pname{font-weight:700;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:isolate}
.mango-av{flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.dtag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#eceff1;color:#455a64;border:1px dashed #90a4ae;border-radius:6px;padding:1px 6px}
tr.dummy td{color:#607d8b}
.back{display:block;text-align:center;margin-top:14px;font-weight:800;color:#fff;background:#ff9800;border-radius:14px;padding:14px;text-decoration:none}
@media(min-width:900px){body{font-size:20px}table{font-size:22px}h1{font-size:40px}.wrap{max-width:960px}}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6XY4T8T70S"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 data-i18n="lbTitle">🏆 Leaderboard</h1>
    <p class="explain" id="explain"></p>
    <div id="state" class="state"><span class="spin"></span><span id="stateText"></span></div>
    <table id="tbl" hidden>
      <thead><tr>
        <th data-i18n="colRank">Rank</th><th data-i18n="colScore">Score</th><th data-i18n="colHints">Hint clicks</th>
        <th data-i18n="colAdj">Adjusted</th><th data-i18n="colLevels">Levels</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="meta"><span id="count"></span><span id="updated"></span></div>
  </div>
  <a class="back" href="scan.html" style="background:#43a047;margin-top:10px" data-i18n="liveBoard">🥭 Live board</a>
  <a class="back" href="./" data-i18n="backToGame">← Play Mango Catch</a>
</div>
<script src="config.js?v=20261030b"></script>
<script src="analytics.js?v=20261030b"></script>
<script src="observability.js?v=20261030b"></script>
<script src="i18n.js?v=20261030b"></script>
<script src="avatar.js?v=20261030b"></script>
<script src="scores.js?v=20261030b"></script>
<script src="leaderboard.js?v=20261030b"></script>
</body>
</html>
